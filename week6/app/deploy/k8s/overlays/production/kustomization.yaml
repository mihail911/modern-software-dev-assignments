apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: switchyard

resources:
  - ../..

images:
  - name: registry.switchyard.example/switchyard/api
    newTag: 2.3.1
  - name: registry.switchyard.example/switchyard/router
    newTag: 2.3.1
  - name: registry.switchyard.example/switchyard/worker
    newTag: 2.3.1

patches:
  - path: worker-patch.yaml
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
