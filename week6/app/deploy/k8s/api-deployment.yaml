apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: registry.switchyard.example/switchyard/api:2.3.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: switchyard-config
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /__admin/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/switchyard
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: api-outbox
